[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oneagent"
version = "2.0.0"
description = "OneAgent - Self-building Agentic Platform for Healthcare IT BA/QA Automation"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Muhammad Haris Saeed"},
]
keywords = ["ai", "automation", "qa", "agents", "browser-automation", "fhir", "healthcare-it", "oneagent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.5.0",
    "rich>=13.0.0",
    
    # API
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "click>=8.1.0",
    
    # AI Providers
    "openai>=1.3.0",
    "anthropic>=0.39.0",
    "httpx>=0.25.0",
    
    # Database
    "sqlmodel>=0.0.14",
    "aiosqlite>=0.19.0",
    
    # Browser
    "playwright>=1.40.0",
    
    # Search & Research
    "beautifulsoup4>=4.12.0",
    
    # Data
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-playwright>=0.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

celery = [
    "celery>=5.3.0",
    "redis>=5.0.0",
]

vector = [
    "chromadb>=0.4.0",
]

ollama = [
    "ollama>=0.4.0",
]

gemini = [
    "google-genai>=1.0.0",
]

all = [
    "oneagent[dev,celery,vector,ollama,gemini]",
]

[project.scripts]
oneagent = "oneagent:main"
curemd-superapp = "src.super_app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "modules*", "api*", "agents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end tests",
    "slow: slow running tests",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"
