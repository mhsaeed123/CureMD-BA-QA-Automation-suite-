[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "curemd-ba-qa-automation"
version = "1.0.0"
description = "CureMD BA QA Automation Suite - AI Super App"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "AI Super App Team"}
]
keywords = ["ai", "automation", "qa", "testing", "agents", "browser-automation", "playwright"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
    "openai>=1.3.0",
    "anthropic>=0.7.0",
    "ollama>=0.1.0",
    "playwright>=1.40.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-playwright>=0.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
celery = [
    "celery>=5.3.0",
    "redis>=5.0.0",
]
vector = [
    "chromadb>=0.4.0",
]

[project.scripts]
curemd-superapp = "src.super_app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end tests",
    "slow: slow running tests",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"
